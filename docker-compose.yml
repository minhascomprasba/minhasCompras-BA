version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: minhascompras_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minhascompras}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minhascompras_api
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-minhascompras}
      - PORT=10000
      - HEADLESS=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
